  </main>`, 'edit');
  const drawScenes = () => {
    $('#scenes').innerHTML = d.scenes.map((s, k) => `<div class="scene-edit"><div class="scene-edit-head"><input class="sc-title" maxlength="50" value="${esc(s.title)}" placeholder="Story name"><button class="icon-btn" type="button" data-rm="${k}" aria-label="Remove story" ${d.scenes.length < 2 ? 'hidden' : ''}>${ICON.trash}</button></div>
      <textarea class="sc-scenario" rows="3" placeholder="Scenario: where and how this story starts.">${esc(s.scenario)}</textarea>
      <textarea class="sc-greeting" rows="4" placeholder="Their first message. Put actions in *asterisks*.">${esc(s.greeting)}</textarea></div>`).join('');
  };
  const readScenes = () => { d.scenes = $$('.scene-edit').map(el => ({ title: $('.sc-title', el).value.trim() || 'Story', scenario: $('.sc-scenario', el).value.trim(), greeting: $('.sc-greeting', el).value.trim() })); };
  drawScenes();
  $('#btnAddScene').onclick = () => { readScenes(); d.scenes.push({ title: `Story ${d.scenes.length + 1}`, scenario: '', greeting: '' }); drawScenes(); };
  $('#scenes').onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { readScenes(); d.scenes.splice(+b.dataset.rm, 1); drawScenes(); } };
  const sel = $('#f_voice');
  voiceOptions(sel, d.voice.name ? 'name:' + d.voice.name : 'auto:' + (d.voice.gender || ''));
  $('#f_pitch').oninput = e => { $('#o_pitch').textContent = (+e.target.value).toFixed(2); };
  const readVoice = () => { const v = sel.value; d.voice = { ...d.voice, pitch: +$('#f_pitch').value, name: v.startsWith('name:') ? v.slice(5) : '', gender: v.startsWith('auto:') ? v.slice(5) : d.voice.gender || '' }; };
  $('#btnTestVoice').onclick = () => {
    readVoice(); readScenes();
    const g = d.scenes.map(s => s.greeting).find(Boolean);
    speakText(g || `"Hi, I'm ${$('#f_name').value || 'your character'}."`, { ...d, name: $('#f_name').value || 'them' });
  };
  $('#btnCancel').onclick = back;
  $('#btnAvatar').onclick = () => pickFile('image/*', async f => {
    try { d.avatar = await imageToAvatar(f); $('#avPrev').innerHTML = avatarHtml(d, 'av96'); }
    catch (e) { toast(e.message, true); }
  });
  if ($('#btnNoPhoto')) $('#btnNoPhoto').onclick = e => { d.avatar = ''; $('#avPrev').innerHTML = avatarHtml(d, 'av96'); e.target.remove(); };
  $('#btnAiPic').onclick = async e => {
    const b = e.currentTarget, v = k => $('#f_' + k).value.trim();
    if (!v('name')) return toast('Give them a name first', true);
    if (!v('look') && !v('personality')) return toast('Describe their appearance first', true);
    if (!ready(() => showEdit(id, back))) return;
    b.disabled = true; $('span', b).textContent = 'Painting…';
    try {
      const temp = { ...d, name: v('name'), look: v('look'), personality: v('personality'), tags: v('tags').split(',').map(t => t.trim()) };
      d.avatar = await imageToAvatar(await makeImage(portraitPrompt(temp), '1:1'), 512);
      $('#avPrev').innerHTML = avatarHtml(d, 'av96');
    } catch (err) { toast(niceError(err), true); }
    b.disabled = false; $('span', b).textContent = 'Create with AI';
  };
  $('#btnSave').onclick = () => {
    const name = $('#f_name').value.trim();
    if (!name) return toast('Give them a name first', true);
    const v = k => $('#f_' + k).value.trim();
    readScenes(); readVoice();
    Object.assign(d, { name, emoji: v('emoji'), tagline: v('tagline'), personality: v('personality'), style: v('style'), look: v('look'), examples: v('examples'), model: v('model'),
      tags: v('tags').split(',').map(t => t.trim()).filter(Boolean) });
    if (orig) {
      state.chars[state.chars.findIndex(x => x.id === id)] = d;
      // chats that haven't really started yet pick up the edited opening
      for (const ch of chatsOf(d)) {
        const scene = d.scenes.find(s => s.title === ch.title);
        if (scene && ch.messages.every(m => m.greeting)) {
          ch.scenario = scene.scenario;
          ch.messages = scene.greeting ? [{ id: uid(), role: 'assistant', swipes: [scene.greeting], sw: 0, ts: Date.now(), greeting: true }] : [];
          saveChat(ch.id);
        }
      }
      saveChars();
      back();
    } else {
      d.id = uid(); d.created = Date.now();
      state.chars.unshift(d);
      saveChars();
      showChat(newChat(d, d.scenes[0]).id);
    }
  };
  if (orig) {
    $('#btnExportCard').onclick = () => shareFile(JSON.stringify(toCard(orig), null, 2), orig.name.replace(/[^\w-]+/g, '_') + '.json', 'application/json');
    $('#btnDelete').onclick = () => {
      if (!confirm(`Delete ${orig.name} and every chat with them? This can't be undone.`)) return;
      for (const ch of chatsOf(orig)) { delete state.chats[ch.id]; saveChat(ch.id); }
      for (const g of state.chars) if (g.group) g.members = g.members.filter(m => m !== id);
      if (!orig.libId) { DB.del('gal:c:' + id).catch(storageErr); delete galCache['c:' + id]; }
      state.chars = state.chars.filter(x => x.id !== id);
      saveChars();
      showHome();
    };
  }
}

const refChar = r => (r.startsWith('lib:') ? LIBRARY.find(l => l.id === r.slice(4)) : charById(r));
const GROUP_MODES = {
  natural: ['Natural', 'Whoever you were talking to answers, and sometimes someone else jumps in. Say a name to choose who replies.'],
  one: ['Take turns', 'One character answers each message, rotating through the group. Say a name to choose who replies.'],
  all: ['Everyone', 'Every character replies to each of your messages, one after another. Costs more per message.'],
};
function showGroupEdit(id, back) {
  const orig = id && charById(id);
  const d = orig
    ? { members: orig.members.filter(r => charById(r)), scenario: (orig.scenes[0] || {}).scenario || '', replyMode: orig.replyMode || 'natural' }
    : { members: [], scenario: '', replyMode: 'natural' };
  mount(`
  <header class="bar"><button class="text-btn" id="btnCancel">Cancel</button><h2>${orig ? 'Edit group' : 'New group chat'}</h2><button class="text-btn strong" id="btnSave">Save</button></header>
  <main class="scroll form">
    <div class="avatar-pick" id="gPrev"></div>
    <label class="field"><span>Group name <em>optional</em></span><input id="g_name" maxlength="60" placeholder="Uses everyone's names if empty" value="${esc(orig ? orig.name : '')}"></label>
    <div class="section">Who's in it <em>2 to 6 characters</em></div>
    <div id="gMembers"></div>
    <button class="btn" id="btnAddMember" type="button">+ Add someone</button>
    <label class="field" style="margin-top:12px"><span>Scenario</span><textarea id="g_scenario" rows="4" placeholder="Where are you all, and what's going on? e.g. A snowed-in ski lodge. Everyone's had a few drinks, and the power just went out.">${esc(d.scenario)}</textarea></label>
    <div class="field"><span>Who replies</span><div class="seg" id="gMode">${Object.entries(GROUP_MODES).map(([k, v]) => `<button type="button" data-mode="${k}" class="${d.replyMode === k ? 'on' : ''}">${v[0]}</button>`).join('')}</div></div>
    <p class="hint" id="gModeHint" style="margin-top:-6px"></p>
    <p class="hint">Tap a name above the message box any time to make that character talk next.</p>
    ${orig ? '<button class="btn danger" id="btnDelete">Delete group</button>' : ''}
  </main>`, 'edit');
  const draw = () => {
    const ms = d.members.map(refChar);
    $('#gPrev').innerHTML = groupAvatar(ms, 'av96');
    $('#gMembers').innerHTML = ms.map((m, k) => `<div class="pick">${avatarHtml(m, 'av36')}<span><b>${esc(m.name)}</b><small>${esc(m.tagline)}</small></span><button class="icon-btn" type="button" data-rm="${k}" aria-label="Remove ${esc(m.name)}">×</button></div>`).join('')
      || '<p class="hint" style="margin:0 4px 12px">Nobody yet. Add at least two characters.</p>';
    $('#btnAddMember').hidden = d.members.length >= 6;
    $('#gModeHint').textContent = GROUP_MODES[d.replyMode][1];
  };
  draw();
  $('#gMembers').onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { d.members.splice(+b.dataset.rm, 1); draw(); } };
  $('#gMode').onclick = e => {
    const b = e.target.closest('[data-mode]');
    if (!b) return;
    d.replyMode = b.dataset.mode;
    $$('#gMode button').forEach(x => x.classList.toggle('on', x === b));
    draw();
  };
  $('#btnAddMember').onclick = () => {
    const taken = new Set(d.members);
    const mine = state.chars.filter(c => !c.group && !taken.has(c.id));
    const lib = LIBRARY.filter(l => !libHave(l) && !taken.has('lib:' + l.id));
    const row = (ref, c) => `<button class="pick" data-ref="${esc(ref)}">${avatarHtml(c, 'av36')}<span><b>${esc(c.name)}</b><small>${esc(c.tagline)}</small></span></button>`;
    const sh = openSheet(`<div class="sheet-title">Add to the group</div><div class="sheet-body">
      ${mine.length ? '<div class="section" style="margin-top:4px">Your characters</div>' + mine.map(c => row(c.id, c)).join('') : ''}
      ${lib.length ? '<div class="section">From Discover</div>' + lib.map(l => row('lib:' + l.id, l)).join('') : ''}</div>`);
    sh.classList.add('tall');
    sh.onclick = e => { const b = e.target.closest('[data-ref]'); if (!b) return; d.members.push(b.dataset.ref); closeSheet(); draw(); };
  };
  $('#btnCancel').onclick = back;
  $('#btnSave').onclick = () => {
    if (d.members.length < 2) return toast('Add at least two characters', true);
    const members = d.members.map(r => (r.startsWith('lib:') ? adopt(refChar(r)).id : r));
    const names = members.map(m => callName(charById(m)));
    const autoName = names.length > 1 ? names.slice(0, -1).join(', ') + ' & ' + last(names) : names[0];
    const name = $('#g_name').value.trim() || autoName;
    const scenario = $('#g_scenario').value.trim();
    if (orig) {
      Object.assign(orig, { name, members, replyMode: d.replyMode, tagline: autoName, scenes: [{ title: 'Group chat', scenario, greeting: '' }] });
      for (const ch of chatsOf(orig)) if (!ch.messages.length) { ch.scenario = scenario; saveChat(ch.id); }
      saveChars();
      back();
    } else {
      const g = normalizeChar({ id: uid(), group: true, name, members, replyMode: d.replyMode, tagline: autoName, emoji: '👥', scenes: [{ title: 'Group chat', scenario, greeting: '' }], created: Date.now() });
      state.chars.unshift(g);
      saveChars();
      showChat(newChat(g, g.scenes[0]).id);
    }
  };
  if (orig) $('#btnDelete').onclick = () => {
    if (!confirm(`Delete the group "${orig.name}" and its chats? The characters themselves stay.`)) return;
    for (const ch of chatsOf(orig)) { delete state.chats[ch.id]; saveChat(ch.id); }
    state.chars = state.chars.filter(x => x.id !== id);
    saveChars();
    showHome();
  };
}

function showSettings(back) {

  back = back || showHome;

    ${range('repPen', 'Repetition penalty (open models)', 1, 1.3, 0.01, '1.00 = off')}

  $('#btnExport').onclick = exportBackup;
  $('#btnImport').onclick = () => pickFile('.png,.json,image/png,application/json', importFile);
}

async function testConnection(btn) {
  const need = configured();
  if (need) return toast(need, true);
  btn.disabled = true; btn.textContent = 'Testing…';
  try {
    let out = '';
    await callModel([{ role: 'user', content: 'Reply with the single word: ready' }], d => { out += d; }, undefined, { stream: false, max_tokens: 20, plain: true });
    toast('Connected ✓' + (out.trim() ? '  "' + clip(out.trim(), 40) + '"' : ''));
  } catch (e) { toast(niceError(e), true); }
  finally { btn.disabled = false; btn.textContent = 'Test connection'; }
}

async function browseModels(kind) {
  const s = state.settings, img = kind === 'image', key = img ? 'imageModel' : 'model';

  if (!img && !base()) return toast('Add the server URL first', true);
  const sh = openSheet(`<div class="sheet-head"><span style="width:64px"></span><b>${img ? 'Choose a picture model' : 'Choose a model'}</b><button class="text-btn" data-x>Close</button></div>
    <input class="sheet-search" placeholder="${img ? 'Search, e.g. flux, seedream, grok' : 'Search, e.g. llama, mistral, free'}" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="model-list"><p class="empty">Loading models…</p></div>`);
  sh.classList.add('tall');
  $('[data-x]', sh).onclick = () => closeSheet();
  const list = $('.model-list', sh), q = $('.sheet-search', sh);
  let models;
  try {
    const res = await fetch(img ? OR_URL + '/images/models' : base() + '/models', { headers: s.apiKey ? { Authorization: 'Bearer ' + s.apiKey } : {} });
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    const j = await res.json();
    models = (j.data || j.models || []).map(m => ({
      id: m.id, name: m.name || m.id, ctx: m.context_length,
      pin: m.pricing ? +m.pricing.prompt * 1e6 : NaN, pout: m.pricing ? +m.pricing.completion * 1e6 : NaN,
    })).sort((a, b) => a.name.localeCompare(b.name));
  } catch (e) {
    list.innerHTML = `<p class="empty">Couldn't load the model list (${esc(niceError(e))}). You can type a model name into the Model box instead.</p>`;
    return;
  }
  const p = n => (n < 0.1 ? n.toFixed(3) : n < 10 ? n.toFixed(2) : n.toFixed(0));
  const price = m => (isNaN(m.pin) || m.pin < 0 ? '' : m.pin === 0 && m.pout === 0 ? ' · free' : ` · $${p(m.pin)} in / $${p(m.pout)} out per 1M`);
  const draw = () => {
    const words = q.value.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = models.filter(m => words.every(w => (m.id + ' ' + m.name).toLowerCase().includes(w))).slice(0, 250);
    list.innerHTML = hits.map(m => `<button class="model${m.id === s[key] ? ' on' : ''}" data-id="${esc(m.id)}"><b>${esc(m.name)}</b><small>${esc(m.id)}${m.ctx ? ' · ' + Math.round(m.ctx / 1000) + 'k memory' : ''}${price(m)}</small></button>`).join('')
      || '<p class="empty">No matches.</p>';
  };
  q.oninput = draw;
  draw();
  list.onclick = e => {
    const b = e.target.closest('[data-id]');
    if (!b) return;
    s[key] = b.dataset.id;
    saveSettings();
    if ($('#s_' + key)) $('#s_' + key).value = s[key];
    closeSheet();
    toast(img ? 'Picture model set' : 'Model set');
  };
}

/* ---------- sheets ---------- */
function openSheet(inner) {
  closeSheet(true);
  const back = document.createElement('div'), sh = document.createElement('div');
  back.className = 'sheet-back';
  sh.className = 'sheet';
  sh.innerHTML = '<div class="grab"></div>' + inner;
  app.append(back, sh);
  requestAnimationFrame(() => requestAnimationFrame(() => { back.classList.add('open'); sh.classList.add('open'); }));
  back.onclick = () => closeSheet();
  state.sheet = { back, sh };
  return sh;
}
function closeSheet(instant) {
  const s = state.sheet;
  if (!s) return;
  state.sheet = null;
  if (instant) { s.back.remove(); s.sh.remove(); return; }
  s.back.classList.remove('open'); s.sh.classList.remove('open');
  setTimeout(() => { s.back.remove(); s.sh.remove(); }, 280);
}
function sheetMenu(items, title) {
  const sh = openSheet((title ? `<div class="sheet-title">${esc(title)}</div>` : '') +
    items.map((it, k) => `<button class="sheet-item ${it[3] || ''}" data-k="${k}">${ICON[it[0]] || ''}<span>${esc(it[1])}</span></button>`).join(''));
  sh.onclick = e => {
    const b = e.target.closest('[data-k]');
    if (!b) return;
    closeSheet(true);
    items[+b.dataset.k][2]();
  };
}
function textSheet({ title, value, placeholder, save }) {
  const sh = openSheet(`<div class="sheet-head"><button class="text-btn" data-x>Cancel</button><b>${esc(title)}</b><button class="text-btn strong" data-ok>Save</button></div>
    <textarea class="sheet-text" placeholder="${esc(placeholder || '')}">${esc(value || '')}</textarea>`);
  sh.classList.add('tall');
  $('[data-x]', sh).onclick = () => closeSheet();
  $('[data-ok]', sh).onclick = () => { save($('textarea', sh).value); closeSheet(); };
}

/* ---------- import / export ---------- */
async function imageToAvatar(blob, size = 400) {
  const url = URL.createObjectURL(blob);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Couldn't read that image")); i.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight, s = Math.min(w, h);
    const cv = document.createElement('canvas');
    cv.width = cv.height = size;
    // square crop, biased toward the top of tall portraits where faces usually are
    cv.getContext('2d').drawImage(img, (w - s) / 2, h > w ? (h - s) * 0.15 : 0, s, s, 0, 0, size, size);
    return cv.toDataURL('image/jpeg', 0.86);
  } finally { URL.revokeObjectURL(url); }
}
function pngText(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf), lat = new TextDecoder('latin1'), out = {};
  let p = 8;
  while (p + 12 <= u8.length) {
    const len = dv.getUint32(p), type = lat.decode(u8.subarray(p + 4, p + 8)), d = u8.subarray(p + 8, p + 8 + len);
    const z = d.indexOf(0);
    if (type === 'tEXt' && z > 0) out[lat.decode(d.subarray(0, z)).toLowerCase()] = lat.decode(d.subarray(z + 1));
    if (type === 'iTXt' && z > 0 && d[z + 1] === 0) {
      let q = d.indexOf(0, z + 3) + 1;
      q = d.indexOf(0, q) + 1;
      out[lat.decode(d.subarray(0, z)).toLowerCase()] = new TextDecoder().decode(d.subarray(q));
    }
    if (type === 'IEND') break;
    p += 12 + len;
  }
  return out;
}
function decodeCardText(s) {
  s = s.trim();
  if (s.startsWith('{')) return s;
  return new TextDecoder().decode(Uint8Array.from(atob(s), ch => ch.charCodeAt(0)));
}
function cardToChar(card) {
  const d = card.data && typeof card.data === 'object' ? card.data : card;
  const vx = (d.extensions && d.extensions.velvet) || {};
  const desc = d.description ?? d.char_persona ?? '', pers = d.personality ?? '';
  return normalizeChar({
    id: uid(), created: Date.now(), avatar: '',
    name: String(d.name || d.char_name || 'Unnamed').trim(),
    tagline: vx.tagline || '', bio: vx.bio || '', emoji: vx.emoji || '', colors: vx.colors, style: vx.style || '', voice: vx.voice,
    tags: Array.isArray(d.tags) ? d.tags.filter(t => typeof t === 'string') : [],
    personality: [desc, pers && 'Personality: ' + pers].filter(x => x && String(x).trim()).join('\n\n'),
    scenes: Array.isArray(vx.scenes) ? vx.scenes : undefined,
    scenario: d.scenario ?? d.world_scenario ?? '',
    greeting: d.first_mes ?? d.char_greeting ?? '',
    altGreetings: Array.isArray(d.alternate_greetings) ? d.alternate_greetings.filter(g => typeof g === 'string' && g.trim()) : [],
    examples: String(d.mes_example ?? d.example_dialogue ?? '').replace(/<START>/gi, '').trim(),
  });
}
function toCard(c) {
  const first = c.scenes[0] || {};
  return {
    spec: 'chara_card_v2', spec_version: '2.0',
    data: {
      name: c.name, description: c.personality, personality: '', scenario: first.scenario || '', first_mes: first.greeting || '',
      mes_example: c.examples || '', alternate_greetings: c.scenes.slice(1).map(s => s.greeting).filter(Boolean),
      creator_notes: c.tagline || '', system_prompt: '', post_history_instructions: '', tags: c.tags, creator: '', character_version: '',
      extensions: { velvet: { tagline: c.tagline, bio: c.bio, emoji: c.emoji, colors: c.colors, style: c.style, scenes: c.scenes, voice: c.voice } },
    },
  };
}
async function importFile(file) {
  try {
    const buf = await file.arrayBuffer(), u8 = new Uint8Array(buf);
    if (u8[0] === 0x89 && u8[1] === 0x50 && u8[2] === 0x4e) {
      const tx = pngText(buf), raw = tx.ccv3 || tx.chara;
      if (!raw) throw new Error('this image has no character card inside it.');
      const c = cardToChar(JSON.parse(decodeCardText(raw)));
      c.avatar = await imageToAvatar(new Blob([buf], { type: 'image/png' }));
      return addImported(c);
    }
    const j = JSON.parse(new TextDecoder().decode(u8));
    if (j.app === 'velvet') return restoreBackup(j);
    if (j.spec || j.data || j.name || j.char_name) return addImported(cardToChar(j));
    throw new Error("that file isn't a character card or a Velvet backup.");
  } catch (e) {
    toast('Import failed: ' + (e instanceof SyntaxError ? "couldn't read the file." : e.message), true);
  }
}
function addImported(c) {
  state.chars.unshift(c);
  saveChars();
  toast(c.name + ' added');
  showChat(newChat(c, c.scenes[0]).id);
}
async function restoreBackup(j) {
  const chars = (Array.isArray(j.characters) ? j.characters : []).map(normalizeChar);
  if (!confirm(`Restore this backup (${chars.length} characters)? Characters you have now are kept; matching ones are replaced by the backup's version.`)) return;
  const ids = new Set(chars.map(c => c.id));
  state.chars = [...chars, ...state.chars.filter(c => !ids.has(c.id))];
  for (const [key, ch] of Object.entries(j.chats || {})) { const m = migrateChat(key, ch); state.chats[m.id] = m; await saveChat(m.id); }
  for (const c of state.chars) if (!c.chatId && state.chats[c.id]) c.chatId = c.id;
  for (const [id, url] of Object.entries(j.images || {})) { state.libImages[id] = url; await DB.set('img:' + id, url).catch(storageErr); }
  state.settings = { ...DEFAULT_SETTINGS, ...(j.settings || {}), apiKey: state.settings.apiKey, lockHash: state.settings.lockHash };
  applyTextSize();
  await saveChars();
  await saveSettings();
  toast('Backup restored');
  showHome();
}
function exportBackup() {
  const data = { app: 'velvet', v: 2, exported: new Date().toISOString(), settings: { ...state.settings, apiKey: '', lockHash: '' }, characters: state.chars, chats: state.chats, images: state.libImages };
  return shareFile(JSON.stringify(data), `velvet-backup-${new Date().toISOString().slice(0, 10)}.json`, 'application/json');
}

/* ---------- keyboard-aware height (iOS) ---------- */
const vv = window.visualViewport;
function fitViewport() {
  if (!vv) return;
  document.documentElement.style.setProperty('--app-h', vv.height + 'px');
  document.documentElement.classList.toggle('kb', vv.height < window.innerHeight - 120);
  if (window.scrollY) window.scrollTo(0, 0);
}
if (vv) { vv.addEventListener('resize', fitViewport); vv.addEventListener('scroll', fitViewport); fitViewport(); }

/* ---------- start ---------- */
async function init() {
  try {
    state.settings = { ...DEFAULT_SETTINGS, ...((await DB.get('settings')) || {}) };
    state.chars = ((await DB.get('characters')) || []).map(normalizeChar);
    for (const k of await DB.keys()) {
      if (String(k).startsWith('img:')) { state.libImages[k.slice(4)] = await DB.get(k); continue; }
      if (!String(k).startsWith('chat:')) continue;
      const ch = migrateChat(k.slice(5), await DB.get(k));
      state.chats[ch.id] = ch;
    }
    for (const c of state.chars) {
      if (!c.chatId && state.chats[c.id]) c.chatId = c.id;
      if (c.libId && !c.avatar && state.libImages[c.libId]) c.avatar = state.libImages[c.libId];
    }
  } catch (e) { storageErr(e); }
  if (!state.settings.model) state.settings.model = DEFAULT_SETTINGS.model;
  applyTextSize();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (state.settings.lockHash) showLock('unlock');
  if (state.chars.length) showHome(); else showDiscover();
  if (!state.settings.onboarded) welcome();
}
function welcome() {
  const sh = openSheet(`<div class="prof"><div class="logo" style="margin:0">Velvet</div><p class="tagline">Private AI characters, only on your phone.</p></div>
    <label class="field"><span>What should characters call you?</span><input id="w_name" maxlength="40" placeholder="Your name" autocomplete="given-name"></label>
    <button class="btn primary" data-go>Continue</button>
    <p class="hint" style="margin-top:4px">You can change it, and tell characters more about yourself, in Settings.</p>`);
  const finish = () => {
    state.settings.userName = $('#w_name', sh).value.trim() || state.settings.userName || 'You';
    state.settings.onboarded = true;
    saveSettings();
    closeSheet();
    (state.view === 'home' ? showHome : showDiscover)();
  };
  $('[data-go]', sh).onclick = finish;
  $('#w_name', sh).onkeydown = e => { if (e.key === 'Enter') finish(); };
  state.sheet.back.onclick = finish;
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();
</script>
